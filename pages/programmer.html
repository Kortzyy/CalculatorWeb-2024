<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator — Programmer</title>

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/calculator.css">
</head>

<body class="programmer">

<div class="wrapper">

    <nav class="side-menu" id="menu">
        <div class="menu-grid">
            <a href="../index.html"    class="menu-item"><div class="icon">⌨</div><span>Standard</span></a>
            <a href="scientific.html"  class="menu-item"><div class="icon">∑</div><span>Scientific</span></a>
            <a href="programmer.html"  class="menu-item"><div class="icon">&lt;/&gt;</div><span>Programmer</span></a>
            <a href="currency.html"    class="menu-item"><div class="icon">Ⓒ</div><span>Currency</span></a>
            <a href="temperature.html" class="menu-item"><div class="icon">℃</div><span>Temperature</span></a>
            <a href="bmi.html"         class="menu-item"><div class="icon">⚖</div><span>BMI</span></a>
            <a href="speed.html"       class="menu-item"><div class="icon">➤</div><span>Speed</span></a>
            <a href="time.html"        class="menu-item"><div class="icon">⏱</div><span>Time</span></a>
        </div>
    </nav>

    <main class="calculator">

        <div class="burger" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>

        <!-- 1. Display + base readouts -->
        <section class="display">
            <div class="top-bar">
                <div></div>
                <div class="history-toggle" onclick="toggleHistory()">History</div>
            </div>
            <div class="operation" id="operation"></div>
            <div class="result" id="result">0</div>
        </section>

        <section class="readouts" aria-label="Base readouts">
            <div class="readout" data-base="HEX">
                <span class="readout-label">HEX</span>
                <span class="readout-value" id="hexDisplay">0</span>
                <button class="copy-btn" data-copy="hexDisplay">Copy</button>
            </div>
            <div class="readout" data-base="DEC">
                <span class="readout-label">DEC</span>
                <span class="readout-value" id="decDisplay">0</span>
                <button class="copy-btn" data-copy="decDisplay">Copy</button>
            </div>
            <div class="readout" data-base="OCT">
                <span class="readout-label">OCT</span>
                <span class="readout-value" id="octDisplay">0</span>
                <button class="copy-btn" data-copy="octDisplay">Copy</button>
            </div>
            <div class="readout" data-base="BIN">
                <span class="readout-label">BIN</span>
                <span class="readout-value" id="binDisplay">0</span>
                <button class="copy-btn" data-copy="binDisplay">Copy</button>
            </div>
        </section>

        <!-- 2. Mode & bit controls -->
        <section class="mode-bar">
            <div class="mode-group mode-base" role="group" aria-label="Number base">
                <button class="base-btn" data-base="HEX">HEX</button>
                <button class="base-btn active" data-base="DEC">DEC</button>
                <button class="base-btn" data-base="OCT">OCT</button>
                <button class="base-btn" data-base="BIN">BIN</button>
            </div>
            <div class="mode-group" role="group" aria-label="Bit width">
                <button class="base-btn" data-width="8">8</button>
                <button class="base-btn" data-width="16">16</button>
                <button class="base-btn active" data-width="32">32</button>
                <button class="base-btn" data-width="64">64</button>
            </div>
            <div class="mode-group" role="group" aria-label="Signed or unsigned">
                <button class="base-btn active" data-sign="signed">Signed</button>
                <button class="base-btn" data-sign="unsigned">Unsigned</button>
            </div>
        </section>

        <!-- 3. Bit grid (built by programmer.js) -->
        <section class="bit-grid" id="bitGrid" aria-label="Bit grid"></section>

        <!-- 4. Keypad: bitwise | digits | arithmetic -->
        <section class="keypad">
            <div class="zone zone-bitwise">
                <button class="bitwise" data-op="&amp;">AND</button>
                <button class="bitwise" data-op="|">OR</button>
                <button class="bitwise" data-op="^">XOR</button>
                <button class="bitwise" data-action="not">NOT</button>
                <button class="bitwise" data-op="&lt;&lt;">&lt;&lt;</button>
                <button class="bitwise" data-op="&gt;&gt;">&gt;&gt;</button>
            </div>

            <div class="zone zone-digits">
                <button class="hex-btn" data-num="D">D</button>
                <button class="hex-btn" data-num="E">E</button>
                <button class="hex-btn" data-num="F">F</button>
                <button class="hex-btn" data-num="A">A</button>
                <button class="hex-btn" data-num="B">B</button>
                <button class="hex-btn" data-num="C">C</button>
                <button data-num="7">7</button>
                <button data-num="8">8</button>
                <button data-num="9">9</button>
                <button data-num="4">4</button>
                <button data-num="5">5</button>
                <button data-num="6">6</button>
                <button data-num="1">1</button>
                <button data-num="2">2</button>
                <button data-num="3">3</button>
                <button class="clear" data-action="clear">AC</button>
                <button data-num="0">0</button>
                <button data-action="delete">⌫</button>
            </div>

            <div class="zone zone-ops">
                <button class="operator" data-op="/">÷</button>
                <button class="operator" data-op="*">×</button>
                <button class="operator" data-op="-">−</button>
                <button class="operator" data-op="+">+</button>
                <button class="equal" data-action="equal">=</button>
            </div>
        </section>

    </main>

    <aside class="history-panel" id="historyPanel">
        <h3>History</h3>
        <ul id="historyList"></ul>
        <button id="clearHistoryBtn">Clear History</button>
    </aside>

</div>

<script src="../assets/js/menu.js"></script>
<script src="../assets/js/history.js"></script>
<script src="../assets/js/programmer.js"></script>

</body>
</html>
